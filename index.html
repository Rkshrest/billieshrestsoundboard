<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billie Eilish Soundboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg"></div>

  <div class="app">
    <h2>Billie Eilish Soundboard</h2>

    <p id="now-playing">Now Playing: None</p>

    <div class="grid">
      <button class="btn" data-sound="clip1">everything i wanted</button>
      <button class="btn" data-sound="clip2">i love you</button>
      <button class="btn" data-sound="clip3">the 30th</button>
      <button class="btn" data-sound="clip4">wildflower</button>
    </div>

    <label class="vol-label">
      Volume:
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
    </label>

    <button id="mute" class="mute">Mute</button>
  </div>

<script src="script.js"></script>
</body>
</html>
